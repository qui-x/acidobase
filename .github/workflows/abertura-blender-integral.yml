name: SIAB | Abertura integral em Blender 3D
on:
  push:
    branches: [feature/siab-abertura-blender-completa]
    paths:
      - 'estudos/abertura-blender-completa/**'
      - '.github/workflows/abertura-blender-integral.yml'
  pull_request:
    branches: [main]
    paths:
      - 'estudos/abertura-blender-completa/**'
      - '.github/workflows/abertura-blender-integral.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blender3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Blender, FFmpeg e navegador para leituras cientificas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender ffmpeg python3-numpy
          blender --version | head -2
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Checagens estaticas
        run: |
          python3 -m py_compile estudos/abertura-blender-completa/build_scene.py
          node --check estudos/abertura-blender-completa/extrair_leituras.mjs
      - name: Iniciar SIAB e ler pH/cor com SIAB.chem
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/siab-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          node estudos/abertura-blender-completa/extrair_leituras.mjs
      - name: Modelar exportar e renderizar tudo pelo Blender
        run: |
          blender -b --factory-startup -t 2             --python estudos/abertura-blender-completa/build_scene.py --             --values estudos/abertura-blender-completa/data/leituras.json             --out dist/siab3d --render-frames
      - name: Compilar video e validar os arquivos Blender
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate 30             -i dist/siab3d/frames/siab_%04d.png             -c:v libx264 -crf 21 -pix_fmt yuv420p             -movflags +faststart dist/siab3d/SIAB_abertura_Blender.mp4
          cp estudos/abertura-blender-completa/preview/index.html dist/siab3d/index.html
          cp dist/siab3d/quadros/siab_2860.png dist/siab3d/poster.png
          python3 - <<'PY'
          from pathlib import Path
          import json,struct
          root=Path('dist/siab3d')
          for name in ['SIAB_abertura_completa.blend','SIAB_abertura_completa.glb','SIAB_abertura_Blender.mp4','poster.png','index.html']:
              p=root/name
              assert p.is_file() and p.stat().st_size>1000,(name,'ausente/vazio')
          b=(root/'SIAB_abertura_completa.glb').read_bytes()
          assert b[:4]==b'glTF' and struct.unpack_from('<I',b,8)[0]==len(b)
          length,kind=struct.unpack_from('<I4s',b,12)
          assert kind==b'JSON'
          data=json.loads(b[20:20+length])
          names=[n.get('name','') for n in data['nodes']]
          for prefix,n in [('TUBO_DE_VIDRO_3D_',5),('CONTA_GOTAS_BULBO_',5),
                           ('LIQUIDO_VOLUMETRICO_',15),('GOTA_3D_',15),('PH_MEDIDO_',15)]:
              assert len([x for x in names if x.startswith(prefix)])==n,(prefix,n)
          assert data.get('animations'), 'Sem animacao exportada'
          print('PASS: .blend, .glb animado, MP4 REAL, 5 pipetas, 5 tubos, 15 fases quimicas')
          PY
      - name: Publicar somente artefatos de homologacao
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siab-abertura-blender-3d-${{ github.run_number }}
          path: |
            dist/siab3d/SIAB_abertura_completa.blend
            dist/siab3d/SIAB_abertura_completa.glb
            dist/siab3d/SIAB_abertura_Blender.mp4
            dist/siab3d/poster.png
            dist/siab3d/index.html
            dist/siab3d/quadros/*.png
            estudos/abertura-blender-completa/data/leituras.json
          if-no-files-found: warn
          retention-days: 21
