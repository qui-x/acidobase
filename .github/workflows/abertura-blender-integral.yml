name: SIAB | Abertura integral em Blender 3D
on:
  push:
    branches: [feature/siab-abertura-blender-completa]
    paths:
      - 'estudos/abertura-blender-completa/**'
      - '.github/workflows/abertura-blender-integral.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blender3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Blender, FFmpeg e navegador para leituras cientificas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender ffmpeg python3-numpy
          blender --version | head -2
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium firefox webkit
      - name: Checagens estaticas
        run: |
          python3 -m py_compile estudos/abertura-blender-completa/build_scene.py
          node --check estudos/abertura-blender-completa/extrair_leituras.mjs
      - name: Iniciar SIAB e ler pH/cor com SIAB.chem
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/siab-server.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then break; fi
            sleep 1
          done
          node estudos/abertura-blender-completa/extrair_leituras.mjs
      - name: Modelar exportar e renderizar tudo pelo Blender
        run: |
          blender -b --factory-startup -t 2             --python estudos/abertura-blender-completa/build_scene.py --             --values estudos/abertura-blender-completa/data/leituras.json             --out dist/siab3d --render-frames
      - name: Compilar video e validar os arquivos Blender
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate 30             -i dist/siab3d/frames/siab_%04d.png             -c:v libx264 -crf 21 -pix_fmt yuv420p             -movflags +faststart dist/siab3d/SIAB_abertura_Blender.mp4
          cp estudos/abertura-blender-completa/preview/index.html dist/siab3d/index.html
          cp dist/siab3d/quadros/siab_2860.png dist/siab3d/poster.png
          python3 - <<'PY'
          from pathlib import Path
          import json,struct
          root=Path('dist/siab3d')
          for name in ['SIAB_abertura_completa.blend','SIAB_abertura_completa.glb','SIAB_abertura_Blender.mp4','poster.png','index.html']:
              p=root/name
              assert p.is_file() and p.stat().st_size>1000,(name,'ausente/vazio')
          b=(root/'SIAB_abertura_completa.glb').read_bytes()
          assert b[:4]==b'glTF' and struct.unpack_from('<I',b,8)[0]==len(b)
          length,kind=struct.unpack_from('<I4s',b,12)
          assert kind==b'JSON'
          data=json.loads(b[20:20+length])
          names=[n.get('name','') for n in data['nodes']]
          for prefix,n in [('TUBO_DE_VIDRO_3D_',5),('CONTA_GOTAS_BULBO_',5),
                           ('LIQUIDO_VOLUMETRICO_',15),('GOTA_3D_',15),('PH_MEDIDO_',15)]:
              assert len([x for x in names if x.startswith(prefix)])==n,(prefix,n)
          assert data.get('animations'), 'Sem animacao exportada'
          print('PASS: .blend, .glb animado, MP4 REAL, 5 pipetas, 5 tubos, 15 fases quimicas')
          PY
      - name: Preparar versão 3D destinada à main
        if: github.event_name == 'push'
        run: |
          git fetch origin main:refs/remotes/origin/main
          git worktree add --detach /tmp/siab-ready refs/remotes/origin/main
          python3 estudos/abertura-blender-completa/publish_to_worktree.py /tmp/siab-ready dist/siab3d
          python3 -m http.server 8777 --bind 127.0.0.1 --directory /tmp/siab-ready > /tmp/siab-release.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8777/index.html >/dev/null; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8777/assets/abertura/siab-blender-intro.mp4)" = 200
      - name: Homologação integrada Chromium Firefox WebKit
        if: github.event_name == 'push'
        run: node estudos/abertura-blender-completa/smoke_release.mjs
      - name: Publicar somente após todos os testes na main e na branch do Pages
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/siab-ready add -A css/abertura-v5.css js/ui/abertura.js index.html sw.js assets/abertura
          git -C /tmp/siab-ready commit -m "feat(siab): abertura integral Blender 3D renderizada e homologada"
          git -C /tmp/siab-ready push origin HEAD:refs/heads/main
          DEFAULT_BRANCH="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          PAGE_SOURCE="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.source.branch // ""' 2>/dev/null || true)"
          echo "main publicada; default=$DEFAULT_BRANCH; pages-source=$PAGE_SOURCE"
          declare -A targets=()
          targets["$DEFAULT_BRANCH"]=1
          if [ -n "$PAGE_SOURCE" ]; then targets["$PAGE_SOURCE"]=1; fi
          for target in "${!targets[@]}"; do
            [ "$target" = "main" ] && continue
            [[ "$target" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::branch inválida"; exit 1; }
            git fetch origin "$target:refs/remotes/origin/$target"
            dir="/tmp/siab-release-$(echo "$target" | tr '/' '-')"
            git worktree add --detach "$dir" "refs/remotes/origin/$target"
            python3 estudos/abertura-blender-completa/publish_to_worktree.py "$dir" dist/siab3d
            git -C "$dir" add -A css/abertura-v5.css js/ui/abertura.js index.html sw.js assets/abertura
            git -C "$dir" commit -m "feat(siab): publicar abertura Blender 3D no GitHub Pages"
            git -C "$dir" push origin "HEAD:refs/heads/$target"
            echo "Publicado também em $target"
          done
      - name: Publicar somente artefatos de homologacao
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siab-abertura-blender-3d-${{ github.run_number }}
          path: |
            dist/siab3d/SIAB_abertura_completa.blend
            dist/siab3d/SIAB_abertura_completa.glb
            dist/siab3d/SIAB_abertura_Blender.mp4
            dist/siab3d/poster.png
            dist/siab3d/index.html
            dist/siab3d/quadros/*.png
            estudos/abertura-blender-completa/data/leituras.json
          if-no-files-found: warn
          retention-days: 21
